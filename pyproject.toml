[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "[project]
name = "context-stream""
version = "1.0.1"
description = "AI-powered project mapping for the DebugFlow ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm",
    "llama-cpp-python",
    "debugflow",
]

[project.scripts]
context-stream  = "context_stream.cli:main"
context-logs    = "context_stream.cli:toggle_logs"
context-logs-on = "context_stream.cli:logs_on"
context-logs-off = "context_stream.cli:logs_off"

[tool.setuptools.packages.find]
package-dir = {"" = "src"}
include = ["context_stream*"]
